<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4ec">
  <meta name="description" content="Bé Vẽ Vui – tô màu vui nhộn, đơn giản cho bé từ 2 tuổi.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bé Vẽ Vui">
  <title>Bé Vẽ Vui</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="app.js">
</head>
<body>
  <!-- Home: pick a picture -->
  <div id="home" class="home">
    <header class="home-bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🎨</span><b>Bé Vẽ Vui</b></div>
      <div class="home-actions">
        <button id="home-sound" class="round-btn" type="button" aria-pressed="true" aria-label="Tắt âm thanh">🔊</button>
        <button id="fullscreen-btn" class="round-btn" type="button" aria-label="Toàn màn hình" hidden>⛶</button>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Chọn loại tranh"></nav>
    <main id="grid" class="grid" aria-live="polite"></main>
  </div>

  <!-- Colouring screen (full screen) -->
  <div id="paint" class="paint" hidden>
    <header class="paint-bar">
      <button id="home-btn" class="round-btn home-btn" type="button" aria-label="Về trang chủ">🏠</button>
      <h1 id="paint-title" class="paint-title"></h1>
      <div class="paint-actions">
        <button id="sound-btn" class="round-btn" type="button" aria-pressed="true" aria-label="Tắt âm thanh">🔊</button>
        <button id="undo-btn" class="round-btn" type="button" aria-label="Quay lại bước trước" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="reset-btn" class="round-btn reset-btn" type="button" aria-label="Giữ để xóa hết màu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 3.5v5h5"/></svg>
          <span class="hold-ring" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <div class="paint-body">
      <div id="stage" class="stage">
        <img id="placeholder" class="placeholder" alt="">
        <canvas id="canvas" class="page" hidden></canvas>
        <div id="hint" class="hint" hidden>Giữ nút để xóa hết</div>
      </div>
      <div id="palette" class="palette" role="radiogroup" aria-label="Chọn màu"></div>
    </div>
  </div>

  <!-- Praise -->
  <div id="praise" class="praise" hidden>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <section class="praise-card" role="dialog" aria-modal="true" aria-labelledby="praise-title">
      <div class="praise-mascot" aria-hidden="true">🐻</div>
      <h2 id="praise-title">Giỏi quá!</h2>
      <p id="praise-text">Bé tô màu đẹp quá!</p>
      <div class="praise-actions">
        <button id="praise-stay" class="round-btn big" type="button" aria-label="Tô tiếp tranh này">🖍️</button>
        <button id="praise-next" class="round-btn big primary" type="button" aria-label="Tranh khác">➡️</button>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
