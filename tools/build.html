  <style>body{font:15px system-ui,sans-serif;margin:24px;color:#333}button{font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#8d7cf6;color:#fff;cursor:pointer}button:disabled{opacity:.5}pre{background:#f6f3f0;padding:12px;border-radius:10px;height:70vh;overflow:auto}</style>

<body>
  <h1>Build colouring assets</h1>
